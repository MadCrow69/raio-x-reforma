# Motores oficiais da Receita em rede interna. Só o serviço `web` (Caddy) publica
# porta no host: 8080 (HTTP, uso local).
# Para o spike: docker compose -f docker-compose.yml -f docker-compose.spike.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    image: raio-x-reforma/web
    restart: unless-stopped
    ports:
      - "8080:80"
    networks: [interna]
    depends_on:
      motor-regular: { condition: service_healthy }
      motor-simples: { condition: service_healthy }

  base:
    build:
      context: .
      dockerfile: motores/regime-regular.Dockerfile
      target: base
    image: raio-x-reforma/base
    deploy: { replicas: 0 }   # só constrói a imagem; nunca sobe

  motor-regular:
    build:
      context: .
      dockerfile: motores/regime-regular.Dockerfile
      target: runtime
    image: raio-x-reforma/motor-regular
    restart: unless-stopped
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/swagger-ui/index.html HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  motor-simples:
    build:
      context: .
      dockerfile: motores/simples-nacional.Dockerfile
      target: runtime
      additional_contexts:
        base: "service:base"
    image: raio-x-reforma/motor-simples
    restart: unless-stopped
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf \"GET /api/swagger-ui/index.html HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  interna: {}
